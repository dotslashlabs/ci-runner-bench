name: seed

# Populates the warm caches that arm-a restores. Run this once per runner
# before the collection window opens, and again only if a cache is evicted.
# Each job runs the workload cold, then saves ~/.bench-cache under the stable
# key that arm-a reads.

on:
  workflow_dispatch:
    inputs:
      vendors:
        description: "Comma-separated vendors to seed"
        required: false
        default: "github,blacksmith"

permissions:
  contents: read

concurrency:
  group: seed
  cancel-in-progress: false

env:
  NODE_VERSION: "22.11.0"
  RUST_TOOLCHAIN: "stable"

jobs:
  setup:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      runners: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        uses: ./.github/actions/runner-matrix
        with:
          vendors: ${{ inputs.vendors || vars.BENCH_VENDORS || 'github' }}

  seed:
    name: "seed|${{ matrix.runner.vendor }}|${{ matrix.workload }}"
    needs: setup
    runs-on: ${{ matrix.runner.label }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(needs.setup.outputs.runners) }}
        workload: [w1, w2]

    steps:
      - name: Checkout harness
        uses: actions/checkout@v4

      - name: Runner facts
        uses: ./.github/actions/runner-facts

      - name: Resolve workload pin
        id: pin
        run: |
          set -euo pipefail
          source workloads.lock
          case "${{ matrix.workload }}" in
            w1) echo "repo=$W1_REPO" >> "$GITHUB_OUTPUT"
                echo "sha=$W1_SHA"   >> "$GITHUB_OUTPUT" ;;
            w2) echo "repo=$W2_REPO" >> "$GITHUB_OUTPUT"
                echo "sha=$W2_SHA"   >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Checkout workload repository
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pin.outputs.repo }}
          ref: ${{ steps.pin.outputs.sha }}
          path: work

      - name: Set up Node
        if: matrix.workload == 'w1'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Rust
        if: matrix.workload == 'w2'
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal --no-self-update
          rustup default "${RUST_TOOLCHAIN}"
          cargo --version

      - name: Run workload cold
        env:
          CACHE_MODE: cold
        run: ./scripts/run_workload.sh ${{ matrix.workload }}

      - name: Report cache size
        run: du -sm ~/.bench-cache || true

      - name: Save warm cache
        uses: actions/cache/save@v4
        with:
          path: ~/.bench-cache
          key: bench-a-${{ matrix.runner.vendor }}-${{ matrix.workload }}-v2

  seed-docker:
    name: "seed|${{ matrix.runner.vendor }}|w4"
    needs: setup
    runs-on: ${{ matrix.runner.label }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(needs.setup.outputs.runners) }}

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/runner-facts
      - uses: docker/setup-buildx-action@v3

      - name: Populate the Docker layer cache
        env:
          CACHE_MODE: warm
        run: ./scripts/run_workload.sh w4

  seed-cache-payload:
    name: "seed|${{ matrix.runner.vendor }}|t2payload"
    needs: setup
    runs-on: ${{ matrix.runner.label }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(needs.setup.outputs.runners) }}

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/runner-facts

      # actions/cache restores first and skips the save on a hit, so re-running
      # seed.yml is safe and never duplicates the entry.
      - name: Seed the cache-throughput payload
        id: payload
        uses: actions/cache@v4
        with:
          path: ~/.bench-cache/payload
          key: t2-${{ matrix.runner.vendor }}-v1

      - name: Build the payload on a miss
        if: steps.payload.outputs.cache-hit != 'true'
        run: ./scripts/make_payload.sh

      - name: Report payload size
        run: du -sm ~/.bench-cache/payload
